server.port=8080
spring.application.name=memoridocx

# MySQL / MariaDB (XAMPP). La clave por defecto de root esta vacia.
spring.datasource.url=jdbc:mysql://localhost:3306/memoridocx?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&connectTimeout=5000
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# El esquema se crea con schema.sql (evidencia del proyecto)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Propiedades del prototipo
memoridocx.ocr.min-text-length=20
memoridocx.chunk.size=900
memoridocx.chunk.overlap=120
memoridocx.retrieval.max-chunks=3
memoridocx.retrieval.min-score=0.05
memoridocx.ai.timeout-ms=40000

logging.level.com.memoridocx=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
